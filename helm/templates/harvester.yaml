apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.network }}-harvester
spec:
  replicas: {{ len .Values.storage.plots.iscsi }}
  selector:
    matchLabels:
      app: {{ .Values.network }}-harvester
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
  - metadata:
      name: {{ .Values.network }}-plots
    spec:
      accessModes:
      - ReadOnlyMany
      volumeMode: Filesystem
      storageClassName: {{ .Values.storage.plots.storageClassName }}
      resources:
        requests:
          storage: {{ .Values.storage.plots.size }}
      selector:
        matchLabels:
          storagetype: {{ .Values.storage.plots.storageType }}
  template:
    metadata:
      labels:
        app: {{ .Values.network }}-harvester
    spec:
      volumes:
      - name: secret-ca
        secret:
          secretName: {{ .Values.network }}-ca
          defaultMode: 420
      - name: chiaroot
        emptyDir: {}
      containers:
      - name: chia
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        ports:
        - name: daemon
          containerPort: {{ .Values.ports.harvester.daemon }}
          protocol: TCP
        - name: peers
          containerPort: {{ .Values.ports.harvester.peers }}
          protocol: TCP
        - name: rpc
          containerPort: {{ .Values.ports.harvester.rpc }}
          protocol: TCP
        env:
        - name: service
          value: harvester
        - name: recursive_plot_scan
          value: 'true'
        - name: farmer_address
          value: '{{ .Values.network }}-farmer'
        - name: farmer_port
          value: '{{ .Values.ports.farmer.peers }}'
        - name: parallel_decompressor_count
          value: '1'
        - name: decompressor_thread_count
          value: '1'
        {{ include "chia.commonEnv" . | nindent 8 }}
        volumeMounts:
        - name: secret-ca
          mountPath: /chia-ca
        - name: chiaroot
          mountPath: /chia-data
        - name: {{ .Values.network }}-plots
          readOnly: true
          mountPath: /plots
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              # iSCSIマウントポイントの読み取りテスト
              if ! timeout 5 ls /plots > /dev/null 2>&1; then
                echo "ERROR: Cannot access /plots directory"
                exit 1
              fi
              
              # ディレクトリが空でないことを確認
              if [ -z "$(ls -A /plots 2>/dev/null)" ]; then
                echo "ERROR: /plots directory is empty"
                exit 1
              fi
              
              # 実際にファイルにアクセス可能か確認
              if ! timeout 5 find /plots -maxdepth 1 -type f > /dev/null 2>&1; then
                echo "ERROR: Cannot read files in /plots"
                exit 1
              fi
              
              exit 0
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              # iSCSIマウントポイントへの高速アクセステスト
              if ! timeout 3 ls /plots > /dev/null 2>&1; then
                echo "WARN: /plots directory not accessible"
                exit 1
              fi
              
              # Chiaデーモンの状態確認
              if ! timeout 3 chia rpc harvester get_plots > /dev/null 2>&1; then
                echo "WARN: Harvester RPC not responding"
                exit 1
              fi
              
              exit 0
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2
          successThreshold: 1
      - name: exporter
        image: ghcr.io/chia-network/chia-exporter:latest
        ports:
        - name: exporter
          containerPort: {{ .Values.ports.harvester.exporter }}
          protocol: TCP
        env:
        - name: CHIA_EXPORTER_HOSTNAME
          value: localhost
        {{ include "chia.commonEnv" . | nindent 8 }}
        volumeMounts:
        - name: chiaroot
          mountPath: /chia-data
      restartPolicy: Always
